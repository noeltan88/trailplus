<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/dhumj7ari/image/upload/v1777890295/trail_favicon_vjg1nr.png" />
    <link rel="apple-touch-icon" href="https://res.cloudinary.com/dhumj7ari/image/upload/v1777890295/trail_favicon_vjg1nr.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Trail+ Your Mountain Bike Specialist" />
    <meta property="og:title" content="Trail+ | Your Mountain Bike Specialist" />
    <meta property="og:description" content="Singapore's MTB Performance Lab. Expert servicing, custom builds and precision tuning." />
    <meta property="og:image" content="https://res.cloudinary.com/dhumj7ari/image/upload/q_auto/f_auto/v1777899543/Screenshot_2026-05-02_at_10.51.51_AM_hpc2f5.png" />
    <meta property="og:url" content="https://trailplus.netlify.app" />
    <meta property="og:type" content="website" />
    <title>Trail+ | Your Mountain Bike Specialist</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Hidden static form for Netlify build-time detection.
         Submissions are handled by the React app via fetch. -->
    <form name="servicing-request" data-netlify="true" hidden>
      <input type="hidden" name="form-name" value="servicing-request" />
      <input type="radio"  name="servicing" value="Full Service (Full-sus MTB) — S$250" />
      <input type="radio"  name="servicing" value="Full Service (Hardtail) — S$200" />
      <input type="radio"  name="servicing" value="Basic Service (All bikes) — S$100" />
      <input type="radio"  name="delivery"  value="Self drop-off" />
      <input type="radio"  name="delivery"  value="Pick-up" />
      <input type="radio"  name="delivery"  value="Drop-off" />
      <input type="text"   name="first-name" />
      <input type="text"   name="last-name" />
      <input type="text"   name="address" />
      <input type="tel"    name="mobile" />
      <input type="email"  name="email" />
      <input type="text"   name="bike-brand" />
      <input type="text"   name="bike-model" />
      <input type="text"   name="bike-year" />
      <textarea            name="additional-requests"></textarea>
      <select              name="referral">
        <option>Friend / Word of Mouth</option>
        <option>Instagram</option>
        <option>Facebook</option>
        <option>Google Search</option>
        <option>Walk-by / Shop Signage</option>
        <option>Other</option>
      </select>
    </form>
  </body>
</html>
